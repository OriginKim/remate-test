<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Receipt Master | 분석 및 관리</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 95%; max-width: 800px; margin-bottom: 20px; }
        .preview { max-width: 200px; margin: 15px auto; border-radius: 8px; display: none; border: 1px solid #ddd; }
        .btn-main { background: #333; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; font-size: 0.9rem; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
        th { background-color: #f8f9fa; color: #555; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .ANALYZING { background: #fff3cd; color: #856404; }
        .APPROVED { background: #d4edda; color: #155724; }
        .REJECTED { background: #f8d7da; color: #721c24; }
        .action-btn { padding: 5px 10px; margin: 2px; border-radius: 4px; border: 1px solid #ddd; cursor: pointer; background: white; }
        .btn-approve { color: #28a745; border-color: #28a745; }
        .btn-reject { color: #dc3545; border-color: #dc3545; }
    </style>
</head>
<body>

<div class="card">
    <h2>📸 영수증 업로드</h2>
    <input type="file" id="fileInput" accept="image/*" multiple onchange="previewImage(this)">
    <img id="imagePreview" class="preview">
    <button onclick="uploadReceipts()" class="btn-main">AI 분석 시작</button>
    <p id="status" style="margin-top:10px; color:#666;"></p>
</div>

<div class="card">
    <h3>📋 분석된 영수증 내역
        <button onclick="fetchReceipts()" style="float: right; font-size: 0.8rem;">🔄 새로고침</button>
        <button onclick="location.href='/api/receipts/export'" style="float: right; font-size: 0.8rem; margin-right: 5px;">📥 CSV 저장</button>
    </h3>
    <table>
        <thead>
        <tr>
            <th>ID</th><th>상호명</th><th>날짜</th><th>금액</th><th>상태</th><th>관리</th>
        </tr>
        </thead>
        <tbody id="receiptList">
        </tbody>
    </table>
    <button onclick="location.href='/'" style="margin-top:20px; background:none; border:none; color:#999; text-decoration:underline; cursor:pointer;">홈으로 돌아가기</button>
</div>

<script>
    function previewImage(input) {
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function fetchReceipts() {
        try {
            const response = await fetch('/api/receipts');
            const list = await response.json();
            const html = list.map(r => `
                <tr>
                    <td>${r.id}</td>
                    <td><strong>${r.storeName}</strong></td>
                    <td>${r.tradeDate || '-'}</td>
                    <td>${r.totalAmount.toLocaleString()}원</td>
                    <td><span class="status-badge ${r.status}">${r.status}</span></td>
                    <td>
                        <button class="action-btn btn-approve" onclick="updateStatus(${r.id}, 'APPROVED')">승인</button>
                        <button class="action-btn btn-reject" onclick="updateStatus(${r.id}, 'REJECTED')">반려</button>
                    </td>
                </tr>
            `).join('');
            document.getElementById('receiptList').innerHTML = html || '<tr><td colspan="6">데이터가 없습니다.</td></tr>';
        } catch (e) { console.error(e); }
    }

    async function uploadReceipts() {
        const fileInput = document.getElementById('fileInput');
        const files = fileInput.files;
        const statusText = document.getElementById('status');

        if (files.length === 0) return alert("영수증 사진을 선택해주세요!");

        // 11장을 한꺼번에 보내는 게 아니라, 하나씩 11번 보냅니다.
        for (let i = 0; i < files.length; i++) {
            statusText.innerText = `⏳ AI 분석 중... (${i + 1}/${files.length})`;

            const formData = new FormData();
            // 단일 업로드용 파라미터인 'file'로 보냅니다.
            formData.append('file', files[i]);
            formData.append('workspaceId', 1);
            formData.append('userId', 1);

            try {
                // 아까 잘 작동했던 단일 업로드 주소(/api/receipts/upload)를 사용합니다.
                const response = await fetch('/api/receipts/upload', {
                    method: 'POST',
                    headers: {
                        'X-IDEMPOTENCY-KEY': 'key-' + Date.now() + '-' + i
                    },
                    body: formData
                });

                if (!response.ok) {
                    console.error(`${i+1}번째 파일 업로드 실패`);
                }
            } catch (error) {
                console.error("에러 발생:", error);
            }
        }

        statusText.innerText = `✅ 모든 영수증(${files.length}건) 분석 완료!`;
        fetchReceipts(); // 모든 업로드가 끝나면 목록 갱신
        fileInput.value = ""; // 입력창 초기화
        document.getElementById('imagePreview').style.display = 'none';
    }

    async function updateStatus(id, status) {
        await fetch(`/api/receipts/${id}/status?status=${status}`, { method: 'PATCH' });
        fetchReceipts();
    }

    window.onload = fetchReceipts;
</script>
</body>
</html>
